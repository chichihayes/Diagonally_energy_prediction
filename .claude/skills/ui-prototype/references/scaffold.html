<!--
PROTOTYPE SCAFFOLD
This is the starting structure for any prototype generated by the ui-prototype skill.
Adapt the design tokens, screens, and navigation to match the spec.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[Product Name] — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  /* ============ DESIGN TOKENS (from spec §10) ============ */
  :root {
    /* Colors — replace with values from spec */
    --color-brand: #2563EB;
    --color-brand-hover: #1D4ED8;
    --color-brand-pressed: #1E40AF;

    --color-bg: #FFFFFF;
    --color-bg-elevated: #FAFAFA;
    --color-surface: #F4F4F5;
    --color-text: #18181B;
    --color-text-secondary: #52525B;
    --color-text-tertiary: #A1A1AA;
    --color-border: #E4E4E7;
    --color-border-strong: #D4D4D8;

    --color-success: #16A34A;
    --color-warning: #D97706;
    --color-error: #DC2626;
    --color-info: #2563EB;

    /* Spacing (4px base) */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
    --space-12: 48px; --space-16: 64px;

    /* Radii */
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
    --radius-xl: 16px; --radius-2xl: 24px; --radius-full: 9999px;

    /* Shadows */
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -2px rgba(0,0,0,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -4px rgba(0,0,0,0.05);

    /* Motion */
    --duration-micro: 100ms;
    --duration-fast: 150ms;
    --duration-base: 200ms;
    --duration-slow: 300ms;
    --easing-standard: cubic-bezier(0.2, 0, 0, 1);
  }

  /* Base reset */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #18181B;
    color: var(--color-text);
    overflow: hidden;
    height: 100vh;
  }

  /* Prototype shell ============================== */
  .proto-shell {
    display: grid;
    grid-template-columns: 320px 1fr 320px;
    height: 100vh;
    gap: 16px;
    padding: 16px;
    box-sizing: border-box;
  }
  @media (max-width: 1100px) {
    .proto-shell { grid-template-columns: 1fr; padding: 0; gap: 0; }
    .proto-shell .panel-left, .proto-shell .panel-right { display: none; }
  }

  .panel {
    background: #27272A;
    border-radius: 12px;
    padding: 16px;
    color: #FAFAFA;
    overflow-y: auto;
    font-size: 13px;
  }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #A1A1AA; margin: 0 0 8px; }
  .panel button { background: #3F3F46; color: #FAFAFA; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .panel button:hover { background: #52525B; }
  .panel button.active { background: var(--color-brand); }

  /* Device frame ============================== */
  .device-frame-wrap {
    display: flex; align-items: center; justify-content: center;
  }
  .device-frame {
    background: var(--color-bg);
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    position: relative;
    transition: width var(--duration-base) var(--easing-standard),
                height var(--duration-base) var(--easing-standard);
  }
  .device-frame.mobile { width: 390px; height: 844px; }
  .device-frame.tablet { width: 768px; height: 1024px; }
  .device-frame.desktop { width: 100%; height: 100%; max-width: 1440px; max-height: 900px; border-radius: 12px; }

  .device-screen {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Inter', sans-serif;
  }

  /* In-app components ============================== */
  .app-header {
    position: sticky;
    top: 0;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
    padding: 12px 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .app-header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .app-tabbar {
    position: sticky;
    bottom: 0;
    background: var(--color-bg);
    border-top: 1px solid var(--color-border);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .app-tabbar button {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--color-text-secondary);
    font-size: 11px; padding: 4px 12px; cursor: pointer;
    min-width: 44px; min-height: 44px;
  }
  .app-tabbar button.active { color: var(--color-brand); }

  .btn-primary {
    background: var(--color-brand); color: #fff;
    padding: 12px 20px; border-radius: var(--radius-md); border: none;
    font-weight: 500; font-size: 15px; cursor: pointer;
    transition: background var(--duration-micro) var(--easing-standard);
    min-height: 44px;
  }
  .btn-primary:hover { background: var(--color-brand-hover); }
  .btn-primary:active { background: var(--color-brand-pressed); }

  .btn-secondary {
    background: var(--color-surface); color: var(--color-text);
    padding: 12px 20px; border-radius: var(--radius-md);
    border: 1px solid var(--color-border); font-weight: 500;
    font-size: 15px; cursor: pointer; min-height: 44px;
  }

  /* Modal overlay */
  .modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    animation: fadeIn var(--duration-base) var(--easing-standard);
  }
  .modal {
    background: var(--color-bg); border-radius: var(--radius-xl);
    padding: 24px; margin: 16px; max-width: 360px; width: 100%;
    animation: modalIn var(--duration-base) var(--easing-standard);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

  /* Bottom sheet */
  .sheet-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 100; display: flex; align-items: flex-end;
    animation: fadeIn var(--duration-base) var(--easing-standard);
  }
  .sheet {
    background: var(--color-bg);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 24px; width: 100%;
    animation: sheetIn var(--duration-slow) var(--easing-standard);
  }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }

  /* Toast */
  .toast {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--color-text); color: var(--color-bg);
    padding: 12px 20px; border-radius: var(--radius-full); font-size: 14px;
    z-index: 200; box-shadow: var(--shadow-lg);
    animation: toastIn var(--duration-slow) var(--easing-standard);
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* Screen transition */
  .screen-enter { animation: slideInRight var(--duration-slow) var(--easing-standard); }
  @keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--color-surface) 0%, var(--color-border) 50%, var(--color-surface) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: var(--radius-md);
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* List item touch target */
  .list-item { min-height: 64px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--color-border); cursor: pointer; }
  .list-item:hover { background: var(--color-bg-elevated); }
  .list-item:active { background: var(--color-surface); }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body x-data="prototypeApp()" x-init="init()">

<div class="proto-shell">

  <!-- LEFT PANEL: Screen jumper + state switcher -->
  <aside class="panel panel-left">
    <h2>Prototype</h2>
    <div style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">[Product Name]</div>
    <div style="font-size: 12px; color: #A1A1AA; margin-bottom: 16px;">v1.0 · clickable preview</div>

    <h2>Device</h2>
    <div style="display: flex; gap: 6px; margin-bottom: 16px;">
      <button @click="device = 'mobile'" :class="device === 'mobile' && 'active'">Mobile</button>
      <button @click="device = 'tablet'" :class="device === 'tablet' && 'active'">Tablet</button>
      <button @click="device = 'desktop'" :class="device === 'desktop' && 'active'">Desktop</button>
    </div>

    <h2>Jump to screen</h2>
    <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;">
      <template x-for="screen in screens" :key="screen.id">
        <button @click="navigate(screen.route)" :class="currentScreen === screen.id && 'active'" style="text-align: left; padding: 8px 12px;">
          <span x-text="screen.name"></span>
        </button>
      </template>
    </div>

    <h2>State</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px;">
      <template x-for="s in ['populated', 'empty', 'loading', 'error', 'partial', 'auth', 'offline']" :key="s">
        <button @click="forcedState = forcedState === s ? null : s" :class="forcedState === s && 'active'" x-text="s"></button>
      </template>
    </div>

    <h2>Controls</h2>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button @click="back()">← Back</button>
      <button @click="reset()">Reset</button>
    </div>

    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #3F3F46; font-size: 11px; color: #71717A;">
      <div>Route: <code x-text="currentRoute"></code></div>
      <div>Stack: <code x-text="JSON.stringify(history)"></code></div>
    </div>
  </aside>

  <!-- CENTER: Device frame with the app inside -->
  <main class="device-frame-wrap">
    <div class="device-frame" :class="device">
      <div class="device-screen">

        <!-- SCREENS GO HERE -->
        <!-- Each screen is a <template> with x-if="currentScreen === 'screen-id'" -->
        <!-- See per-screen patterns in component-patterns.md -->

        <!-- Example: Home screen -->
        <template x-if="currentScreen === 'home'">
          <div class="screen-enter" style="min-height: 100%;">
            <header class="app-header">
              <h1>Home</h1>
              <div style="margin-left: auto;">
                <button @click="navigate('/search')" style="background: none; border: none; cursor: pointer; padding: 8px;">🔍</button>
              </div>
            </header>

            <!-- Empty state -->
            <template x-if="effectiveState() === 'empty'">
              <div style="padding: 80px 24px; text-align: center;">
                <div style="font-size: 48px; margin-bottom: 16px;">📭</div>
                <h2 style="margin: 0 0 8px;">Nothing here yet</h2>
                <p style="color: var(--color-text-secondary); margin: 0 0 24px;">Follow some topics to see them in your feed.</p>
                <button class="btn-primary" @click="navigate('/explore')">Explore topics</button>
              </div>
            </template>

            <!-- Loading state -->
            <template x-if="effectiveState() === 'loading'">
              <div style="padding: 16px;">
                <template x-for="i in 5">
                  <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                    <div class="skeleton" style="width: 48px; height: 48px; border-radius: 24px;"></div>
                    <div style="flex: 1;">
                      <div class="skeleton" style="height: 14px; width: 60%; margin-bottom: 8px;"></div>
                      <div class="skeleton" style="height: 12px; width: 90%;"></div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Error state -->
            <template x-if="effectiveState() === 'error'">
              <div style="padding: 80px 24px; text-align: center;">
                <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                <h2 style="margin: 0 0 8px;">Couldn't load your feed</h2>
                <p style="color: var(--color-text-secondary); margin: 0 0 24px;">Check your connection and try again.</p>
                <button class="btn-primary" @click="forcedState = null">Retry</button>
              </div>
            </template>

            <!-- Populated state -->
            <template x-if="effectiveState() === 'populated' || effectiveState() === 'partial'">
              <div>
                <template x-for="item in mockData.feed" :key="item.id">
                  <div class="list-item" @click="navigate(`/item/${item.id}`)">
                    <img :src="item.avatar" alt="" style="width: 48px; height: 48px; border-radius: 24px;" />
                    <div style="flex: 1; min-width: 0;">
                      <div style="font-weight: 500;" x-text="item.title"></div>
                      <div style="color: var(--color-text-secondary); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" x-text="item.preview"></div>
                    </div>
                    <div style="font-size: 12px; color: var(--color-text-tertiary);" x-text="item.timestamp"></div>
                  </div>
                </template>

                <!-- Partial state banner -->
                <template x-if="effectiveState() === 'partial'">
                  <div style="padding: 12px 16px; background: #FEF3C7; color: #92400E; font-size: 13px; text-align: center;">
                    Some items couldn't load. <button @click="forcedState = null" style="text-decoration: underline; background: none; border: none; color: inherit; cursor: pointer; padding: 0;">Retry</button>
                  </div>
                </template>
              </div>
            </template>

            <!-- Tab bar -->
            <nav class="app-tabbar">
              <button :class="currentTab === 'home' && 'active'" @click="switchTab('home', '/')">
                <span>🏠</span><span>Home</span>
              </button>
              <button :class="currentTab === 'search' && 'active'" @click="switchTab('search', '/search')">
                <span>🔍</span><span>Search</span>
              </button>
              <button :class="currentTab === 'inbox' && 'active'" @click="switchTab('inbox', '/inbox')">
                <span>📥</span><span>Inbox</span>
              </button>
              <button :class="currentTab === 'profile' && 'active'" @click="switchTab('profile', '/profile')">
                <span>👤</span><span>Profile</span>
              </button>
            </nav>
          </div>
        </template>

        <!-- Add more screens following this pattern -->

        <!-- TOAST -->
        <template x-if="toast">
          <div class="toast" x-text="toast"></div>
        </template>

      </div>
    </div>
  </main>

  <!-- RIGHT PANEL: Notes / spec excerpt -->
  <aside class="panel panel-right">
    <h2>Spec notes</h2>
    <div style="font-size: 12px; line-height: 1.5; color: #D4D4D8;" x-html="currentScreenNotes()"></div>
  </aside>

</div>

<script>
function prototypeApp() {
  return {
    // ==== Configurable ====
    device: 'mobile',
    forcedState: null,           // null = use real data state; otherwise show forced state
    currentRoute: '/',
    currentTab: 'home',
    history: ['/'],
    tabStacks: { home: ['/'], search: ['/search'], inbox: ['/inbox'], profile: ['/profile'] },
    toast: null,

    // ==== Screen registry (populate from spec inventory) ====
    screens: [
      { id: 'home', name: 'Home', route: '/', tab: 'home' },
      { id: 'search', name: 'Search', route: '/search', tab: 'search' },
      { id: 'inbox', name: 'Inbox', route: '/inbox', tab: 'inbox' },
      { id: 'profile', name: 'Profile', route: '/profile', tab: 'profile' },
      { id: 'item-detail', name: 'Item Detail', route: '/item/:id', tab: null },
      { id: 'settings', name: 'Settings', route: '/profile/settings', tab: 'profile' },
      // ... add every screen from §7 of spec
    ],

    // ==== Mock data (populate from mock-data-patterns.md guidance) ====
    mockData: {
      feed: [
        { id: '1', title: 'Maya Patel', preview: 'Hey! Are we still on for tomorrow?', timestamp: '2m', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=maya' },
        { id: '2', title: 'Design weekly digest', preview: 'This week in design: AI in the design process, new Figma plugins...', timestamp: '1h', avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=design' },
        // ... add 20+ items with realistic variety
      ],
      // ... more mock collections per screen
    },

    // ==== Initialization ====
    init() {
      this.parseRoute();
      window.addEventListener('hashchange', () => this.parseRoute());
    },

    // ==== Routing ====
    parseRoute() {
      const hash = window.location.hash.replace(/^#/, '') || '/';
      this.currentRoute = hash;
      // Match route to screen
      const screen = this.matchRoute(hash);
      if (screen) {
        if (screen.tab) this.currentTab = screen.tab;
      }
    },

    matchRoute(route) {
      // Exact match first
      let match = this.screens.find(s => s.route === route);
      if (match) return match;
      // Pattern match for parameterized routes
      for (const s of this.screens) {
        if (s.route.includes(':')) {
          const pattern = new RegExp('^' + s.route.replace(/:[^/]+/g, '[^/]+') + '$');
          if (pattern.test(route)) return s;
        }
      }
      return null;
    },

    navigate(route) {
      this.history.push(route);
      this.currentRoute = route;
      window.location.hash = route;
      this.forcedState = null;   // reset forced state on navigation
      const screen = this.matchRoute(route);
      if (screen && screen.tab) {
        this.currentTab = screen.tab;
        if (!this.tabStacks[screen.tab].includes(route)) {
          this.tabStacks[screen.tab].push(route);
        }
      }
    },

    switchTab(tab, defaultRoute) {
      this.currentTab = tab;
      // Restore the tab's last route
      const stack = this.tabStacks[tab];
      const lastRoute = stack[stack.length - 1] || defaultRoute;
      this.currentRoute = lastRoute;
      window.location.hash = lastRoute;
    },

    back() {
      if (this.history.length > 1) {
        this.history.pop();
        const prev = this.history[this.history.length - 1];
        this.currentRoute = prev;
        window.location.hash = prev;
      }
    },

    reset() {
      this.history = ['/'];
      this.currentRoute = '/';
      this.currentTab = 'home';
      this.tabStacks = { home: ['/'], search: ['/search'], inbox: ['/inbox'], profile: ['/profile'] };
      this.forcedState = null;
      this.toast = null;
      window.location.hash = '/';
    },

    // ==== State helper ====
    effectiveState() {
      return this.forcedState || 'populated';
    },

    get currentScreen() {
      const s = this.matchRoute(this.currentRoute);
      return s ? s.id : null;
    },

    // ==== Notes panel ====
    currentScreenNotes() {
      const notes = {
        'home': '<strong>Home</strong><br/>Primary action: tap an item.<br/>Entry: app launch, Home tab.<br/>Exit: ItemDetail, Search.<br/><br/>States: empty (new user), loading (skeleton), error (full-screen retry), partial (banner + items), populated (feed).',
        'search': '<strong>Search</strong><br/>Primary action: enter query.<br/>...',
        // Add per-screen notes from spec
      };
      return notes[this.currentScreen] || '<em>No notes for this screen yet.</em>';
    },

    // ==== Toast helper ====
    showToast(message, duration = 2500) {
      this.toast = message;
      setTimeout(() => { this.toast = null; }, duration);
    },
  };
}
</script>

</body>
</html>
