<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagonally — Energy Forecast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <!-- Header -->
  <div class="max-w-lg mx-auto bg-white rounded-2xl shadow p-6 mb-4">
    <h1 class="text-xl font-bold text-gray-800">Energy Forecast</h1>
    <p class="text-sm text-gray-500 mt-1">Predict your household consumption for any date</p>
  </div>

  <!-- Prediction form -->
  <div class="max-w-lg mx-auto bg-white rounded-2xl shadow p-6 mb-4">
    <form id="predict-form" novalidate>

      <!-- Date -->
      <div class="mb-5">
        <label for="input-date" class="block text-sm font-medium text-gray-700 mb-1">Date to forecast</label>
        <input type="date" id="input-date" required value="2015-02-10"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>

      <!-- Derived from date (read-only) -->
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Derived from date</p>
      <div class="grid grid-cols-3 gap-3 mb-5">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Day of week (0=Mon)</label>
          <input type="number" id="input-dow" readonly value="1"
            class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-400 cursor-not-allowed" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Month</label>
          <input type="number" id="input-month" readonly value="2"
            class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-400 cursor-not-allowed" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Is weekend</label>
          <input type="number" id="input-weekend" readonly value="0"
            class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-400 cursor-not-allowed" />
        </div>
      </div>

      <!-- Household consumption -->
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Household consumption (Wh)</p>
      <div class="grid grid-cols-3 gap-3 mb-5">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Yesterday</label>
          <input type="number" id="input-lag1" min="0" step="any" required value="10638.64"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">7 days ago</label>
          <input type="number" id="input-lag7" min="0" step="any" required value="14785.26"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">7-day average</label>
          <input type="number" id="input-roll7" min="0" step="any" required value="20023.43"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
      </div>

      <!-- Heater -->
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Electric heater (Wh)</p>
      <div class="grid grid-cols-3 gap-3 mb-5">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Yesterday</label>
          <input type="number" id="input-heater-lag1" min="0" step="any" required value="143.97"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">7 days ago</label>
          <input type="number" id="input-heater-lag7" min="0" step="any" required value="143.99"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">7-day average</label>
          <input type="number" id="input-heater-roll7" min="0" step="any" required value="143.94"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
      </div>

      <!-- Temperature -->
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Temperature (°C)</p>
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Daily mean</label>
          <input type="number" id="input-temp-mean" step="any" required value="2.2"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Daily min</label>
          <input type="number" id="input-temp-min" step="any" required value="0.8"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
        </div>
      </div>

      <!-- Error -->
      <div id="predict-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2"></div>

      <!-- Actions -->
      <div class="flex gap-3">
        <button
          type="submit" id="predict-btn"
          class="flex-1 bg-indigo-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-40 transition-colors"
        >
          Get Forecast
        </button>
      </div>
    </form>
  </div>

  <!-- Result card -->
  <div id="result-card" class="hidden max-w-lg mx-auto bg-white rounded-2xl shadow p-6 mb-4">
    <h2 class="text-base font-semibold text-gray-700 mb-4">Prediction Result</h2>
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Date</p>
        <p id="result-date" class="text-sm font-semibold text-gray-800">—</p>
      </div>
      <div class="bg-indigo-50 rounded-xl p-4">
        <p class="text-xs text-indigo-500 uppercase tracking-wide mb-1">Est. Cost</p>
        <p id="result-cost" class="text-xl font-bold text-indigo-700">—</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Predicted</p>
        <p id="result-wh" class="text-sm font-semibold text-gray-800">—</p>
        <p id="result-kwh" class="text-xs text-gray-400 mt-0.5">—</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-4">
        <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Temperature</p>
        <p id="result-temp" class="text-sm font-semibold text-gray-800">—</p>
      </div>
    </div>

  </div>

  <script src="assets/app.js"></script>
</body>
</html>
