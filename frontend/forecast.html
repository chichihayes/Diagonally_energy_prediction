<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagonally — Energy Forecast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <!-- Location form -->
  <div class="max-w-lg mx-auto bg-white rounded-2xl shadow p-6 mb-6">
    <h1 class="text-xl font-bold text-gray-800 mb-4">Energy Forecast</h1>
    <form id="forecast-form">
      <button
        id="forecast-btn"
        type="submit"
        class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"
      >
        Get Forecast
      </button>
    </form>
    <div id="forecast-spinner" class="hidden mt-4 text-center text-sm text-gray-500">
      Loading…
    </div>
    <div id="forecast-error" class="hidden mt-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-2"></div>
  </div>

  <!-- 24-hour section -->
  <section id="section-24h" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow p-6 mb-6">
    <h2 class="text-base font-semibold text-gray-700 mb-4">24-Hour Outlook</h2>
    <canvas id="chart-24h" height="160"></canvas>
  </section>

  <!-- 7-day section -->
  <section id="section-7d" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow p-6 mb-6">
    <h2 class="text-base font-semibold text-gray-700 mb-4">7-Day Outlook</h2>
    <canvas id="chart-7d" height="160"></canvas>
  </section>

  <!-- Weekly bill section -->
  <section id="section-bill" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow p-6 mb-6">
    <h2 class="text-base font-semibold text-gray-700 mb-4">Estimated cost this week</h2>
    <div id="bill-card"></div>
    <p class="mt-3 text-xs text-gray-400">Based on your 7-day consumption forecast</p>
  </section>

  <!-- Model performance -->
  <div id="model-perf-section" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow p-6 mb-6">
      <button
        id="model-perf-toggle"
        class="flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900"
        onclick="document.getElementById('model-perf-body').classList.toggle('hidden')"
      >
        <span>Model performance</span>
        <span class="text-xs text-gray-400">(click to expand)</span>
      </button>
      <div id="model-perf-body" class="hidden mt-4 space-y-6">
        <div>
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
            Regression models (R²)
          </h3>
          <table class="w-full text-sm border-collapse">
            <thead>
              <tr class="text-left text-gray-500 border-b">
                <th class="pb-1 pr-4">Model</th>
                <th class="pb-1 pr-4">R²</th>
                <th class="pb-1">Winner</th>
              </tr>
            </thead>
            <tbody id="regression-table-body"></tbody>
          </table>
        </div>
        <div>
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
            Forecast models (MAPE)
          </h3>
          <table class="w-full text-sm border-collapse">
            <thead>
              <tr class="text-left text-gray-500 border-b">
                <th class="pb-1 pr-4">Model</th>
                <th class="pb-1 pr-4">MAPE</th>
                <th class="pb-1">Winner</th>
              </tr>
            </thead>
            <tbody id="forecast-table-body"></tbody>
          </table>
        </div>
      </div>
  </div>

  <script>
    async function loadLeaderboard() {
      try {
        const res = await fetch("/api/v1/models/leaderboard");
        if (!res.ok) return;
        const data = await res.json();

        document.getElementById("model-perf-section").classList.remove("hidden");

        const regression = [...data.regression].sort((a, b) => b.r2 - a.r2);
        const rBody = document.getElementById("regression-table-body");
        regression.forEach(row => {
          const tr = document.createElement("tr");
          if (row.winner) tr.style.fontWeight = "bold";
          tr.innerHTML =
            `<td class="py-1 pr-4">${row.model}</td>` +
            `<td class="py-1 pr-4">${row.r2.toFixed(4)}</td>` +
            `<td class="py-1">${row.winner ? "✓" : ""}</td>`;
          rBody.appendChild(tr);
        });

        const forecast = [...data.forecast].sort((a, b) => a.mape - b.mape);
        const fBody = document.getElementById("forecast-table-body");
        forecast.forEach(row => {
          const tr = document.createElement("tr");
          if (row.winner) tr.style.fontWeight = "bold";
          tr.innerHTML =
            `<td class="py-1 pr-4">${row.model}</td>` +
            `<td class="py-1 pr-4">${row.mape.toFixed(4)}</td>` +
            `<td class="py-1">${row.winner ? "✓" : ""}</td>`;
          fBody.appendChild(tr);
        });
      } catch (_) {
        // network error — section stays hidden
      }
    }

    document.addEventListener("DOMContentLoaded", loadLeaderboard);
  </script>

  <script src="assets/app.js"></script>
</body>
</html>
